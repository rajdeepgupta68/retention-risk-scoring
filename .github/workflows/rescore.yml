name: Scheduled Re-scoring

on:
  schedule:
    # Runs every Monday at 06:00 UTC. Adjust cadence to match how often
    # you'd realistically expect new transaction data to arrive.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # allows manually triggering a re-score from the Actions tab

jobs:
  rescore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scoring pipeline
        run: python src/run_scoring.py

      - name: Commit updated scores
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/latest_scores.parquet
          git diff --staged --quiet || git commit -m "Automated re-scoring $(date +'%Y-%m-%d')"
          git push